<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Interview History | AI Interview</title>
    <link rel="icon"
        type="image/png"
        href="../assets/favicon.png">

    <link rel="stylesheet"href="../css/history.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="history-header">

        <div class="logo">
            AI Interview
        </div>

        <button
            id="dashboardButton"
            class="dashboard-button">

            Dashboard

        </button>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="history-container">

        <!-- ================= TITLE ================= -->

        <section class="history-intro">

            <div class="history-icon">
                📊
            </div>

            <h1>
                Interview History
            </h1>

            <p>
                Review your previous interviews,
                scores and performance.
            </p>

        </section>


        <!-- ================= LOADING ================= -->

        <div
            id="loadingMessage"
            class="loading-message">

            Loading your interview history... ⏳

        </div>


        <!-- ================= ERROR ================= -->

        <div
            id="errorMessage"
            class="error-message">

        </div>


        <!-- ================= INTERVIEW LIST ================= -->

        <section
            id="historyContainer"
            class="history-list">

        </section>

    </main>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="../js/history.js"></script>

</body>

</html>
