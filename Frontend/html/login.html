<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | AI Interview</title>
    <link rel="icon"
        type="image/png"
        href="../assets/favicon.png">

    <link rel="stylesheet" href="../css/login.css">

</head>

<body>

    <div class="container">

        <div class="login-box">

            <h1>AI Interview</h1>

            <h2>Welcome Back 👋</h2>

            <p>Login to continue your interview preparation.</p>

            <form id="loginForm">

                <!-- ================= EMAIL ================= -->

                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email">

                <small
                    id="emailError"
                    class="error">
                </small>


                <!-- ================= PASSWORD ================= -->

                <label for="password">Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password">

                    <span
                        class="toggle-password"
                        id="togglePassword">

                        👁

                    </span>

                </div>

                <small
                    id="passwordError"
                    class="error">
                </small>


                <!-- ================= OPTIONS ================= -->

                <div class="options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="rememberMe">

                        Remember Me

                    </label>

                    <a href="forgot-password.html">

                        Forgot Password?

                    </a>

                </div>


                <!-- ================= LOGIN BUTTON ================= -->

                <button type="submit">

                    Login

                </button>

            </form>


            <!-- ================= REGISTER ================= -->

            <p class="register">

                Don't have an account?

                <a href="registration.html">

                    Register

                </a>

            </p>

        </div>

    </div>

    <script src="../js/login.js"></script>

</body>

</html>
